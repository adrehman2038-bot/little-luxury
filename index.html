<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M J Traders</title>
<style>
body{font-family:sans-serif;text-align:center;padding:20px;background:#f8f8f8}
.box{background:#fff;padding:20px;border-radius:12px;max-width:360px;margin:auto;box-shadow:0 0 10px #ddd}
input{width:90%;padding:12px;margin:8px;border:1px solid #ccc;border-radius:8px}
.btn{display:block;background:#000;color:#fff;padding:14px;margin:10px auto;border-radius:10px;text-decoration:none;font-weight:bold;border:none;width:95%;cursor:pointer}
.admin{background:#fff;color:#000;border:2px solid #000}
.small{font-size:13px;color:#777}
</style>
</head>
<body>
<h2>M J Traders</h2>
<p>Little Luxury</p>

<div class="box" id="loginBox">
<h3>Login / Register</h3>
<input id="name" placeholder="Apna Naam">
<input id="phone" placeholder="Mobile Number">
<input id="pass" type="password" placeholder="Password Banain">
<button class="btn" onclick="register()">Register / Login</button>
<p class="small">Register karte hi aap login ho jayenge</p>
<hr>
<button class="btn admin" onclick="showAdmin()">Admin Login</button>
</div>

<div class="box" id="orderBox" style="display:none">
<h3>Welcome <span id="userName"></span> 👋</h3>
<p>Order karne ke liye neeche dabain</p>
<a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdazmM9zYNLOwG01u0A2e7xk9C3zeglUlAGONcZzTuOa05ofQ/viewform" target="_blank">Order Now</a>
<button class="btn admin" onclick="logout()">Logout</button>
</div>

<div class="box" id="adminBox" style="display:none">
<h3>Admin Login</h3>
<input id="adminPass" type="password" placeholder="Admin Password">
<button class="btn" onclick="adminLogin()">Login</button>
<p class="small">Admin Password: <b>admin123</b> <br> Baad me isko change kar lena</p>
<button class="btn admin" onclick="back()">Wapis</button>
</div>

<div class="box" id="adminPanel" style="display:none">
<h3>Admin Panel ✅</h3>
<p>Sirf aapko orders dikhenge</p>
<a class="btn" href="https://docs.google.com/forms/u/0/" target="_blank">Orders Dekhen</a>
<button class="btn admin" onclick="logout()">Logout</button>
</div>

<script>
function register(){
let n=document.getElementById('name').value;
let p=document.getElementById('phone').value;
if(n==""||p==""){alert("Naam aur Mobile likhen");return;}
localStorage.setItem('mj_user',n);
document.getElementById('userName').innerText=n;
document.getElementById('loginBox').style.display='none';
document.getElementById('orderBox').style.display='block';
}
function showAdmin(){
document.getElementById('loginBox').style.display='none';
document.getElementById('adminBox').style.display='block';
}
function adminLogin(){
let a=document.getElementById('adminPass').value;
if(a=="admin123"){
document.getElementById('adminBox').style.display='none';
document.getElementById('adminPanel').style.display='block';
}else{alert("Ghalat Password!");}
}
function back(){
document.getElementById('adminBox').style.display='none';
document.getElementById('loginBox').style.display='block';
}
function logout(){location.reload();}
</script>
</body>
</html>
