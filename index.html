<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms Trader UAE - Little Luxury</title>
<style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f8f8f8}header{background:#000;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:10}.banner{width:100%;height:180px;object-fit:cover}.bannerBox{position:relative}.bannerText{position:absolute;bottom:10px;left:10px;background:#ff1744;color:#fff;padding:8px 12px;border-radius:20px;font-weight:bold}.cats{display:flex;gap:8px;overflow:auto;padding:10px}.cats button{white-space:nowrap;background:#fff;border:1px solid #ddd;padding:8px 15px;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}.card img,.card video{width:100%;height:150px;object-fit:cover}.card div{padding:10px}.price{color:#ff1744;font-weight:bold}.btn{width:100%;padding:10px;border:0;border-radius:20px;margin-top:5px}.black{background:#000;color:#fff}.green{background:#25D366;color:#fff}.gold{background:#FFD700}.box{background:#fff;margin:10px;padding:15px;border-radius:12px}input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px}</style>
</head><body>
<header><h2 style="margin:0">✨ Ms Trader</h2><small>LITTLE LUXURY UAE | FREE DELIVERY</small></header>
<div class="bannerBox"><img id="bannerImg" class="banner" src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800"><div class="bannerText">🔥 MEGA SALE - UP TO 50% OFF</div></div>
<div class="cats"><button onclick="filterP('all')">All</button><button onclick="filterP('Perfume')">Perfume</button><button onclick="filterP('Watch')">Watch</button><button onclick="filterP('Fashion')">Fashion</button><button onclick="filterP('Video')">🎥 Video</button></div>
<div class="grid" id="shop"></div>
<div class="box"><h3>🛍️ Login / Register</h3><input placeholder="Apna Naam"><input placeholder="Phone Number"><button class="btn black" onclick="alert('Register Ho Gaya!')">Register Karo</button></div>
<div class="box" id="adminBox" style="display:none"><h3>Admin Login</h3><input id="u" placeholder="admin"><input id="p" type="password" placeholder="Password"><button class="btn" style="background:#ff1744;color:#fff" onclick="if(document.getElementById('u').value=='admin'&&document.getElementById('p').value=='arehman16241'){document.getElementById('adminBox').style.display='none';document.getElementById('panel').style.display='block'}else{alert('Galat Password')}">Admin Login</button></div>
<div class="box" id="panel" style="display:none"><h3>⚙️ PRO Admin Panel</h3><label>Banner Photo:</label><input type="file" accept="image/*" onchange="upBanner(event)"><hr><label>Product Photo / Video:</label><input type="file" accept="image/*,video/*" id="fileIn"><input id="n" placeholder="Product Naam - jaise Luxury Perfume"><input id="pr" placeholder="Price AED - 99"><select id="cat"><option>Perfume</option><option>Watch</option><option>Fashion</option><option>Video</option></select><input id="im" placeholder="Ya Photo Link yahan paste karo"><button class="btn" style="background:green;color:#fff" onclick="addP()">+ Add Product</button><button class="btn" style="background:#ff1744;color:#fff" onclick="localStorage.clear();location.reload()">🗑️ Sab Delete Karo</button><div id="msg"></div></div>
<div style="padding:10px;text-align:center"><h3>💳 Payment Method</h3><button class="btn black" onclick="pay()">Pay with Payoneer / Card</button><button class="btn green" onclick="alert('Cash on Delivery - Paise ghar pe do')">Cash on Delivery</button><p>Ms Trader UAE | WhatsApp: +971 XX XXX XXXX</p></div>
<script>
let P=JSON.parse(localStorage.getItem('P2')||'[{"n":"Luxury Perfume","p":99,"i":"https://images.unsplash.com/photo-1541643600914-78b084683601?w=500","c":"Perfume","t":"img"},{"n":"Smart Watch","p":149,"i":"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500","c":"Watch","t":"img"},{"n":"Fashion Video","p":199,"i":"https://www.w3schools.com/html/mov_bbb.mp4","c":"Video","t":"vid"}]');
let cur='all';let fileData='';
document.getElementById('fileIn').addEventListener('change',e=>{let r=new FileReader();r.onload=()=>fileData=r.result;r.readAsDataURL(e.target.files[0])});
function upBanner(e){let r=new FileReader();r.onload=()=>{document.getElementById('bannerImg').src=r.result;localStorage.setItem('BN',r.result)};r.readAsDataURL(e.target.files[0])}
if(localStorage.getItem('BN'))document.getElementById('bannerImg').src=localStorage.getItem('BN');
function filterP(c){cur=c;show()}
function show(){let L=P.filter(x=>cur=='all'||x.c==cur);document.getElementById('shop').innerHTML=L.map((x,i)=>'<div class="card">'+(x.t=='vid'?'<video controls src="'+x.i+'"></video>':'<img src="'+x.i+'">')+'<div><b>'+x.n+'</b><div class="price">AED '+x.p+'</div><button class="btn black" onclick="pay()">💳 Buy Now - Payoneer</button><button class="btn green" onclick="window.open(\'https://wa.me/971500000000?text=Mujhe '+encodeURIComponent(x.n)+' chahiye\')">WhatsApp Order</button><button class="btn" onclick="delP('+P.indexOf(x)+')">Delete</button></div></div>').join('')}
function addP(){let n=document.getElementById('n').value,pr=document.getElementById('pr').value,im=fileData||document.getElementById('im').value;if(!n||!pr||!im){alert('Naam, Price aur Photo/Video zaroori hai');return}let isVid=im.includes('video')||im.includes('.mp4');P.push({n:n,p:pr,i:im,c:document.getElementById('cat').value,t:isVid?'vid':'img'});localStorage.setItem('P2',JSON.stringify(P));fileData='';show();document.getElementById('msg').innerHTML='✅ Product Add Ho Gaya!'}
function delP(i){if(confirm('Delete karna hai?')){P.splice(i,1);localStorage.setItem('P2',JSON.stringify(P));show()}}
function pay(){alert('Payoneer Payment:\nApna Payoneer Email yahan daalo:\n\n1. Payoneer.com pe jao\n2. Request Payment karo\n3. Customer ko link bhejo\n\nAbhi ke liye WhatsApp pe order lo, Payoneer link baad me yahan lagayenge.')}
show();if(location.hash=='#admin')document.getElementById('adminBox').style.display='block';
</script></body></html>
