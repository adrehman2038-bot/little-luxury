<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms Trader UAE</title>
<style>body{font-family:Arial;margin:0;background:#f5f5f5}header{background:#000;color:#fff;padding:15px;text-align:center}h1{margin:0}.card{background:#fff;margin:10px;padding:10px;border-radius:10px;text-align:center}.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}button{background:#000;color:#fff;border:0;padding:10px 20px;border-radius:20px}.box{background:#fff;margin:10px;padding:15px;border-radius:10px}input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}</style>
</head><body>
<header><h1>Ms Trader</h1><p style="color:#ff1744;font-size:12px">LITTLE LUXURY UAE - FREE DELIVERY</p></header>
<div id="shop"></div>
<div class="box"><h3>Login / Register</h3><input placeholder="Apna Naam"><input placeholder="Phone Number"><button style="width:100%" onclick="alert('Register Ho Gaya!')">Register Karo</button></div>
<div class="box" id="adminBox" style="display:none"><h3>Admin Login</h3><input id="u" placeholder="admin"><input id="p" type="password" placeholder="Password"><button style="width:100%;background:#ff1744" onclick="if(document.getElementById('u').value=='admin'&&document.getElementById('p').value=='arehman16241'){document.getElementById('adminBox').style.display='none';document.getElementById('panel').style.display='block';alert('Admin Login Ho Gaya!')}else{alert('Galat Password')}">Admin Login</button></div>
<div class="box" id="panel" style="display:none"><h3>Admin Panel - Product Add Karo</h3><input id="n" placeholder="Product Naam"><input id="pr" placeholder="Price - 99"><input id="im" placeholder="Photo Link"><button style="width:100%;background:green" onclick="addP()">Add Product</button><div id="msg"></div></div>
<p style="text-align:center;font-size:12px">Ms Trader UAE - Cash on Delivery</p>
<script>
let P=JSON.parse(localStorage.getItem('P')||'[{"n":"Luxury Perfume","p":99,"i":"https://images.unsplash.com/photo-1541643600914-78b084683601?w=500"},{"n":"Smart Watch","p":149,"i":"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"}]');
function show(){document.getElementById('shop').innerHTML=P.map(x=>'<div class="card"><img src="'+x.i+'"><h3>'+x.n+'</h3><p>AED '+x.p+'</p><button onclick="alert(\'Order ke liye WhatsApp karo\')">Order Karo</button></div>').join('')}
function addP(){let n=document.getElementById('n').value,pr=document.getElementById('pr').value,im=document.getElementById('im').value||'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500';if(!n||!pr){alert('Naam aur Price likho');return}P.push({n:n,p:pr,i:im});localStorage.setItem('P',JSON.stringify(P));show();document.getElementById('msg').innerHTML='Product Add Ho Gaya!'}
show();if(location.hash=='#admin'){document.getElementById('adminBox').style.display='block'}
</script>
</body></html>
