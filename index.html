<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ms Trader - Little Luxury</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f5f5}
header{background:#000;color:#fff;padding:15px;text-align:center}
.promo{background:#ff1744;color:#fff;text-align:center;padding:12px;font-weight:bold;font-size:15px}
.promo span{background:#fff;color:#ff1744;padding:3px 10px;border-radius:20px;margin-left:5px}
.hero{background:linear-gradient(135deg,#000,#444);color:#fff;text-align:center;padding:30px 15px}
.box{background:#fff;padding:18px;border-radius:12px;max-width:380px;margin:15px auto;box-shadow:0 2px 10px #ddd;text-align:center}
input{width:92%;padding:12px;margin:7px;border:1px solid #ccc;border-radius:8px}
.btn{display:block;background:#000;color:#fff;padding:13px;margin:10px auto;border-radius:10px;font-weight:bold;border:none;width:95%;cursor:pointer}
.promoBtn{background:#ff1744}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:600px;margin:auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #ddd;text-align:center;padding-bottom:12px}
.card img{width:100%;height:140px;object-fit:cover}
.card h3{font-size:15px;margin:8px 5px}
.card p{color:#e91e63;font-weight:bold}
.card button{background:#000;color:#fff;border:none;padding:10px 20px;border-radius:20px;margin-top:8px;cursor:pointer}
footer{background:#000;color:#aaa;text-align:center;padding:15px;font-size:12px;margin-top:20px}
</style>
</head>
