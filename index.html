<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms Trader UAE</title>
<style>body{font-family:Arial;margin:0;background:#f5f5f5}header{background:#000;color:#fff;padding:15px;text-align:center}.banner{width:100%;height:180px;object-fit:cover}.card{background:#fff;margin:10px;padding:10px;border-radius:12px;text-align:center}.card img,.card video{width:100%;height:180px;object-fit:cover;border-radius:8px}button{background:#000;color:#fff;border:0;padding:10px 20px;border-radius:20px}.box{background:#fff;margin:10px;padding:15px;border-radius:12px}input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px}.uploadBtn{background:#e8f5e9;border:2px dashed green;padding:20px;text-align:center;border-radius:10px;color:green;font-weight:bold}#preview{width:100%;border-radius:10px;margin-top:5px}</style>
</head><body>
<header><h1 style="margin:0">Ms Trader</h1><p style="color:#ff1744;font-size:12px;margin:0">LITTLE LUXURY UAE - FREE DELIVERY</p></header>
<img class="banner" id="bannerImg" src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800">
<div id="shop"></div>
<div class="box"><h3>Login / Register</h3><input placeholder="Apna Naam"><input placeholder="Phone Number"><button style="width:100%" onclick="alert('Register Ho Gaya!')">Register Karo</button></div>
<div class="box" id="adminBox" style="display:none"><h3>Admin Login</h3><input id="u" placeholder="admin"><input id="p" type="password" placeholder="Password"><button style="width:100%;background:#ff1744" onclick="if(document.getElementById('u').value=='admin'&&document.getElementById('p').value=='arehman16241'){document.getElementById('adminBox').style.display='none';document.getElementById('panel').style.display='block'}else{alert('Galat Password - arehman16241 likho, space nahi')}">Admin Login</button></div>
<div class="box" id="panel" style="display:none"><h3>Admin Panel - Unlimited Products</h3>
<label>1. Banner Photo Badlo:</label><input type="file" accept="image/*" onchange="upBanner(event)">
<hr>
<label>2. Product Photo / Video - Gallery se Chuno:</label>
<div class="uploadBtn" onclick="document.getElementById('fileIn').click()">📸 CLICK KARO - GALLERY SE PHOTO / VIDEO CHUNO</div>
<input type="file" id="fileIn" accept="image/*,video/*" style="display:none">
<img id="preview" style="display:none">
<input id="n" placeholder="Product Naam"><input id="pr" placeholder="Price - 99">
<button style="width:100%;background:green" onclick="addP()">+ Add Product</button>
<p style="font-size:12px;color:green">✅ Jitni marzi products add kar sakte ho - Unlimited</p>
<div id="msg"></div></div>
<div style="padding:10px;text-align:center"><button style="width:100%;background:#000" onclick="alert('Payoneer - Apna Payoneer Email batao, main link laga dunga')">💳 Pay with Payoneer / Card</button><p>Ms Trader UAE - Cash on Delivery</p></div>
<script>
let P=JSON.parse(localStorage.getItem('P3')||'[{"n":"Luxury Perfume","p":99,"i":"https://images.unsplash.com/photo-1541643600914-78b084683601?w=500","t":"img"},{"n":"Smart Watch","p":149,"i":"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500","t":"img"}]');
let fileData='';
document.getElementById('fileIn').addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=()=>{fileData=r.result;let pv=document.getElementById('preview');pv.src=r.result;pv.style.display='block'};r.readAsDataURL(f)});
function upBanner(e){let r=new FileReader();r.onload=()=>{document.getElementById('bannerImg').src=r.result;localStorage.setItem('BN',r.result)};r.readAsDataURL(e.target.files[0])}
if(localStorage.getItem('BN'))document.getElementById('bannerImg').src=localStorage.getItem('BN');
function show(){document.getElementById('shop').innerHTML=P.map((x,i)=>'<div class="card">'+(x.t=='vid'?'<video controls src="'+x.i+'"></video>':'<img src="'+x.i+'">')+'<h3>'+x.n+'</h3><p>AED '+x.p+'</p><button onclick="alert(\'Order ke liye WhatsApp karo\')">Order Karo</button> <button style="background:red" onclick="delP('+i+')">Delete</button></div>').join('')}
function addP(){let n=document.getElementById('n').value,pr=document.getElementById('pr').value;if(!n||!pr||!fileData){alert('Pehle Photo chuno, phir Naam aur Price likho');return}let isVid=fileData.includes('video');P.push({n:n,p:pr,i:fileData,t:isVid?'vid':'img'});localStorage.setItem('P3',JSON.stringify(P));fileData='';document.getElementById('preview').style.display='none';show();document.getElementById('msg').innerHTML='✅ Product Add Ho Gaya! Unlimited - Aur bhi add karo'}
function delP(i){if(confirm('Delete karna hai?')){P.splice(i,1);localStorage.setItem('P3',JSON.stringify(P));show()}}
show();if(location.hash=='#admin')document.getElementById('adminBox').style.display='block';
</script></body></html>
