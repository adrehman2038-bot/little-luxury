<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopFlow Connect</title><link rel="manifest" href="manifest.json"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14'/%3E%3Cpath d='M26 26v-6a6 6 0 0 1 12 0v6' fill='none' stroke='%23c9a227' stroke-width='2.6'/%3E%3Cpath d='M17 25h30l3 27H14z' fill='%23c9a227'/%3E%3C/svg%3E"><meta name="theme-color" content="#000000">
<style>
:root{--bg:#fff;--fg:#111;--card:#faf8f3;--line:#e8e2d0;--gold:#c9a227;--y:#ffd400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0e;--fg:#f4f4f4;--card:#1a1a1a;--line:#333}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.promo{background:#000;color:#fff;font-weight:800;text-align:center;padding:9px 12px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:14px;letter-spacing:.3px}
.promo a{background:var(--y);color:#000;padding:4px 12px;border-radius:99px;font-size:12px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px}
.logo{font-weight:900;font-size:20px}.logo b{color:var(--gold)}
.btn{background:#000;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn.g{background:var(--gold);color:#000}.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}.btn.s{padding:6px 10px;font-size:13px}
main{max-width:1100px;margin:auto;padding:16px}
.hero{background:#000;color:#fff;border-radius:16px;padding:36px 22px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,40px)}.hero h1 b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card .im{aspect-ratio:1;display:grid;place-items:center;font-size:64px;background:#f1ead6}.card img,.gal img{width:100%;height:100%;object-fit:cover}
.card .t{padding:10px}.price{font-weight:800}.old{text-decoration:line-through;opacity:.5;font-size:13px;margin-left:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}.badges div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:13px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin:4px 0 10px}
.two{display:grid;grid-template-columns:1fr;gap:20px}@media(min-width:800px){.two{grid-template-columns:1fr 1fr}}
.gal{display:flex;gap:8px;overflow-x:auto}.gal>*{flex:0 0 80%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#f1ead6;display:grid;place-items:center;font-size:90px}
.line{display:flex;justify-content:space-between;padding:6px 0}.tot{font-weight:900;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs .on{background:var(--gold);color:#000}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eee;color:#000}.Paid{background:#c8f0c8}.Failed{background:#f6c6c6}
.note{font-size:12px;opacity:.7}.wa{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;z-index:9}
@media(max-width:600px){.bn img{aspect-ratio:16/9}}.bn{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:16px}.bn a{flex:0 0 100%;scroll-snap-align:center;border-radius:16px;overflow:hidden;display:block}.bn img{width:100%;display:block;aspect-ratio:21/9;object-fit:cover}
footer{text-align:center;padding:24px;font-size:13px;opacity:.8}
</style></head><body><div id="app"></div><a class="wa" id="wa" target="_blank" rel="noopener" title="WhatsApp">💬</a>

async function pay(){const v=i=>$('#'+i).value.trim(),t=totals(),T=D.set.tco;
 if(!v('n')||!v('ph')||!v('ad')){alert('Please fill name, phone and address.');return}
 const o={id:'SF'+Date.now().toString().slice(-8),date:new Date().toLocaleString(),cust:{name:v('n'),phone:v('ph'),email:v('em'),emirate:$('#emr').value,address:v('ad')},
  items:cartRows().map(r=>({name:r.p.name,price:r.p.price,q:r.q})),...t,coupon:coupon&&coupon.code,status:'Processing',pay:'Failed',mode:T.mode};
 const done=ok=>{o.pay=ok?'Paid':'Failed';cartRows().forEach(r=>r.p.stock=Math.max(0,r.p.stock-(ok?r.q:0)));if(ok)D.cart=[];D.orders.unshift(o);save();coupon=null;location.hash='#thanks-'+o.id};
 if(!T.api||!T.merchant||!window.TwoCoInlineCart){ // demo fallback until backend + keys are set
  $('#msg').textContent=T.api?'2Checkout script not loaded.':'Demo mode: set Backend URL + Merchant code in Admin > Settings for real payments.';
  if(confirm('DEMO payment - mark as paid?'))done(true);else done(false);return}
 try{const r=await fetch(T.api.replace(/\/$/,'')+'/api/signature',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:T.mode})});
  const {signature}=await r.json(),C=TwoCoInlineCart;
  C.setup.setMerchant(T.merchant);C.setup.setMode('DYNAMIC');C.register();C.cart.setCurrency('AED');C.cart.setTest(T.mode==='sandbox');
  C.cart.setSignature(signature);C.cart.setOrderExternalRef(o.id);C.cart.setCartLockedFlag&&C.cart.setCartLockedFlag(true);
  C.products.removeAll();
  o.items.forEach(i=>C.products.add({name:i.name,quantity:i.q,price:i.price,type:'PRODUCT',tangible:true}));
  if(t.ship)C.products.add({name:'Shipping',quantity:1,price:t.ship,type:'PRODUCT',tangible:false});
  C.billing.setName(o.cust.name);C.billing.setEmail(o.cust.email);C.billing.setPhone(o.cust.phone);C.billing.setCountry('AE');C.billing.setCity(o.cust.emirate);C.billing.setAddress(o.cust.address);
  C.events.subscribe('cart:finished',()=>done(true));C.events.subscribe('checkout:closed',()=>{});C.cart.checkout()
 }catch(e){$('#msg').textContent='Payment error: '+e.message;done(false)}}

function login(){if($('#au').value==D.set.user&&$('#ap').value==D.set.pass){admin=true;go()}else alert('Wrong login')}
const nv=id=>$('#'+id).value;
function saveP(id){const p=id?P(id):{id:Date.now(),imgs:[]};Object.assign(p,{name:nv('pn'),price:+nv('pp'),old:+nv('po'),stock:+nv('ps'),emoji:nv('pe'),desc:nv('pd'),video:nv('pv')});
 const add=imgsTmp;p.imgs=p.imgs.concat(add);imgsTmp=[];if(!id)D.products.push(p);save();editId=null;go()}
let imgsTmp=[];
function rmImg(i){const p=P(editId);p.imgs.splice(i,1);save();go()}
function delP(id){if(confirm('Remove product?')){D.products=D.products.filter(p=>p.id!=id);save();go()}}
function setSt(id,s){D.orders.find(o=>o.id==id).status=s;save()}
function addCp(){if(nv('cc2')){D.coupons.push({code:nv('cc2').toUpperCase(),pct:+nv('cp'),on:true});save();go()}}
function saveS(){const s=D.set;Object.assign(s,{banner:nv('sb'),freeOver:+nv('sf'),shipFee:+nv('ss'),wa:nv('sw'),fb:nv('sfb'),ig:nv('sig'),tt:nv('stt'),fbPixel:nv('sfp'),ttPixel:nv('stp'),user:nv('au2')});
 if(nv('ap2'))s.pass=nv('ap2');s.banners=(s.banners||[]).concat(bnTmp);bnTmp=[];Object.assign(s.tco,{mode:nv('tm'),merchant:nv('tmc'),pub:nv('tpk'),api:nv('tapi')});save();alert('Saved');go()}
document.addEventListener('change',e=>{if(e.target.id!='pi')return;[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,800/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);imgsTmp.push(c.toDataURL('image/jpeg',.75))};im.src=r.result};r.readAsDataURL(f)})});
function bnList(){if(!(D.set.banners&&D.set.banners.length))D.set.banners=[DEFBN];return D.set.banners}
function rmBn(i){bnList().splice(i,1);save();go()}
function mvBn(i,d){const a=bnList(),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();go()}
document.addEventListener('change',e=>{if(e.target.id!='bi')return;[...e.target.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1400/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);bnList().push(c.toDataURL('image/jpeg',.8));save();go()};im.src=r.result};r.readAsDataURL(f)})});
