<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M J Traders</title>
<style>body{font-family:sans-serif;padding:15px;max-width:500px;margin:auto}input,select,button{width:100%;padding:12px;margin:6px 0;font-size:16px}button{background:green;color:#fff;border:0;border-radius:8px}.card{border:1px solid #ddd;padding:10px;border-radius:8px;margin:8px 0}</style>
</head><body>
<h2>M J Traders - Order Form</h2>
<input id="date" type="date"><input id="name" placeholder="Name"><input id="phone" placeholder="Phone"><input id="address" placeholder="Address"><input id="total" placeholder="Total" type="number"><select id="payment"><option>Cash</option><option>JazzCash</option><option>EasyPaisa</option><option>Bank</option></select>
<button onclick="save()">Order Save Karo</button>
<p><a href="#" onclick="showAdmin()">Admin Page Kholo</a></p>
<div id="admin" style="display:none"><h3>All Orders</h3><div id="list"></div><button onclick="clearAll()">Sab Delete</button></div>
<script>
function save(){
 let o={date:date.value,name:name.value,phone:phone.value,address:address.value,total:total.value,payment:payment.value};
 let a=JSON.parse(localStorage.getItem('orders')||'[]');a.push(o);localStorage.setItem('orders',JSON.stringify(a));
 alert('Order Save Ho Gaya');
}
function showAdmin(){admin.style.display='block';let a=JSON.parse(localStorage.getItem('orders')||'[]');list.innerHTML=a.map((x,i)=>`<div class=card><b>${i+1}. ${x.name}</b><br>${x.date} | ${x.phone}<br>${x.address}<br>Total: ${x.total} | ${x.payment}</div>`).join('')||'Koi order nahi';}
function clearAll(){localStorage.removeItem('orders');showAdmin();}
date.value=new Date().toISOString().slice(0,10);
</script></body></html>
