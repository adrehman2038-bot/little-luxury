<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ms Trader - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f2f2f2;padding:15px}
.box{background:#fff;max-width:420px;margin:30px auto;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);text-align:center}
h2{margin-bottom:5px}
p{color:#666;font-size:14px;margin-bottom:15px}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn2{background:#25D366}
.order{background:#f9f9f9;border:1px solid #eee;padding:12px;border-radius:10px;margin:10px 0;text-align:left;font-size:14px;line-height:1.6}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logout{color:red;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="box" id="loginBox">
<h2>Ms Trader - Admin</h2>
<p>Admin Login</p>
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<button class="btn" onclick="login()">Login</button>
</div>
<div class="box hidden" id="panelBox" style="max-width:600px">
<div class="top"><h2>Admin Panel</h2><span class="logout" onclick="logout()">Logout</span></div>
<p id="welcome"></p>
<button class="btn btn2" onclick="loadOrders()">Orders Dekhen</button>
<div id="orders"></div>
</div>
<script>
let users = {"arehman":"arehman16241","admin":"admin123"};
function login(){
let u = document.getElementById('user').value.trim();
let p = document.getElementById('pass').value.trim();
if(users[u] && users[u]==p){
document.getElementById('loginBox').classList.add('hidden');
document.getElementById('panelBox').classList.remove('hidden');
document.getElementById('welcome').innerText = "Welcome, "+u;
loadOrders();
}else{alert("Ghalat Username ya Password!");}
}
function logout(){
document.getElementById('panelBox').classList.add('hidden');
document.getElementById('loginBox').classList.remove('hidden');
document.getElementById('user').value="";
document.getElementById('pass').value="";
}
function loadOrders(){
let orders = JSON.parse(localStorage.getItem('ms_orders') || '[]');
let div = document.getElementById('orders');
if(orders.length==0){div.innerHTML = "<p style='margin-top:15px'>Abhi koi order nahi hai.</p>";return;}
div.innerHTML = "<h3 style='margin:15px 0'>Total Orders: "+orders.length+"</h3>";
orders.reverse().forEach((o,i)=>{
div.innerHTML += '<div class="order"><b>Order '+(orders.length-i)+'</b><br>Name: '+(o.name||'')+'<br>Phone: '+(o.phone||'')+'<br>Address: '+(o.address||'')+'<br>Product: '+(o.product||'')+'<br>Price: '+(o.price||'')+'<br>Time: '+(o.time||'')+'</div>';
});
}
</script>
</body>
</html>
