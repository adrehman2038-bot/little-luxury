<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Ms Trader</title><style>body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}h2{text-align:center}.box{background:#fff;padding:15px;border-radius:12px;margin:10px 0}input,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;background:#000;color:#fff;border:0;padding:11px;border-radius:20px;margin:5px 0}.card{background:#fff;padding:10px;border-radius:10px;margin:5px 0;text-align:center}.card img{width:100%;height:120px;object-fit:cover}</style></head><body><h2>Ms Trader - ADMIN</h2><div class="box" id="loginBox"><h3>Admin Login</h3><input id="u" placeholder="Username - Arehman"><input id="p" type="password" placeholder="Password"><button style="background:#ff1744" onclick="if(document.getElementById('u').value=='Arehman'&&document.getElementById('p').value=='arehman16241'){document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';showP()}else{alert('Galat Password')}">Login</button></div><div id="panel" style="display:none"><div class="box"><b>➕ Product Add:</b><input type="file" accept="image/*,video/*" id="f"><input id="n" placeholder="Product Naam"><input id="pr" placeholder="Price - 99"><textarea id="d" placeholder="Description likho..." rows="3"></textarea><button style="background:green" onclick="addP()">+ Add Product</button><div id="msg"></div></div><div class="box"><b>🗑️ Products:</b><div id="plist"></div></div></div><script>let P=JSON.parse(localStorage.getItem('P3')||'[]');let fd='';document.getElementById('f').addEventListener('change',e=>{let r=new FileReader();r.onload=()=>{fd=r.result};r.readAsDataURL(e.target.files[0])});function showP(){document.getElementById('plist').innerHTML=P.map((x,i)=>'<div class="card"><img src="'+x.i+'"><b>'+x.n+' - AED '+x.p+'</b><p style="font-size:12px">'+(x.d||'')+'</p><button style="background:red" onclick="P.splice('+i+',1);localStorage.setItem(\'P3\',JSON.stringify(P));showP()">Delete</button></div>').join('')}function addP(){let n=document.getElementById('n').value,pr=document.getElementById('pr').value,ds=document.getElementById('d').value;if(!n||!pr||!fd){alert('Photo chuno');return}P.push({n:n,p:pr,d:ds,i:fd,t:fd.includes('video')?'vid':'img'});localStorage.setItem('P3',JSON.stringify(P));fd='';document.getElementById('msg').innerHTML='✅ Add Ho Gaya!';showP()}</script></body></html>
